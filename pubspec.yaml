name: geges_smartbarber
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  http: ^1.5.0

  # 🔥 versi FlutterFire yang stabil & kompatibel dengan Flutter 3.9
  firebase_core: ^3.4.0
  firebase_auth: ^5.2.1
  cloud_firestore: ^5.4.2
  firebase_storage: ^12.3.0
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^19.5.0

  path: ^1.8.3
  provider: ^6.1.2
  intl: ^0.19.0

  # 🔍 plugin Google Sign-In yang stabil
  google_sign_in: ^6.2.1
  flutter_secure_storage: ^8.0.0

  google_mlkit_face_detection: ^0.11.0
  image_picker: ^1.1.2
  permission_handler: ^12.0.1
  url_launcher: ^6.1.7
  file_picker: ^10.3.8
  flutter_launcher_icons: ^0.14.4


dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.8
  # Use a lightweight in-memory Firestore for unit tests to avoid fragile typed mocks
  fake_cloud_firestore: ^3.1.0
  firebase_auth_mocks: ^0.14.2
  network_image_mock: ^2.1.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/ivon.png"
  min_sdk_android: 21
