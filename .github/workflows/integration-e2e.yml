name: Integration E2E Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  android-integration:
    name: Run integration tests on Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Start Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -no-audio

      - name: Wait for emulator
        run: flutter devices

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Start Firestore emulator
        run: |
          firebase emulators:start --only firestore --project demo --host 0.0.0.0 &> firestore-emulator.log &
          n=0
          until grep -q "All emulators started" firestore-emulator.log || [ $n -ge 60 ]; do n=$((n+1)); sleep 1; done
          tail -n +1 firestore-emulator.log
        env:
          CI: true

      - name: Run integration tests (E2E)
        run: flutter test integration_test/e2e_resume_payment_test.dart --dart-define=FIRESTORE_EMULATOR_HOST=localhost:8080 -d emulator-5554 --no-color --reporter=json
        env:
          ADB_INSTALL_TIMEOUT: '20'
          FIRESTORE_EMULATOR_HOST: 'localhost:8080'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: reports
