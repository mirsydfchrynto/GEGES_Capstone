# yaml-language-server: $schema=https://json.schemastore.org/github-workflow
name: Integration E2E Tests

concurrency:
  group: "integration-e2e-${{ github.ref }}"
  cancel-in-progress: true

on:
  push:
    branches: [ main, master ]
    paths:
      - 'integration_test/**'
      - 'lib/**'
      - 'backend/functions/**'
      - 'pubspec.yaml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'integration_test/**'
      - 'lib/**'
      - 'backend/functions/**'
      - 'pubspec.yaml'
  workflow_dispatch: {}

# Integration E2E runs automatically for PRs and pushes that change integration-related files.
# We limit triggers by path to reduce unnecessary runs and reduce flakiness risk.
jobs:
  android-integration:
    name: Run integration tests on Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Cache Flutter Pub & Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle
          key: ${{ runner.os }}-pub-gradle-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-gradle-

      - name: Install dependencies
        run: flutter pub get

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Start Firestore emulator
        run: |
          firebase emulators:start --only firestore --project demo --host 0.0.0.0 &> firestore-emulator.log &
          n=0
          until grep -q "All emulators started" firestore-emulator.log || [ $n -ge 90 ]; do n=$((n+1)); sleep 1; done
          tail -n +1 firestore-emulator.log
        env:
          CI: true

      - name: Start Android emulator and run tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -euo pipefail
            max=3
            i=1
            while [ $i -le $max ]; do
              echo "E2E attempt $i/$max"
              # Use -d android to pick the running emulator automatically
              flutter test integration_test/e2e_resume_payment_test.dart --dart-define=FIRESTORE_EMULATOR_HOST=localhost:8080 -d android --no-color --reporter=json 2>&1 | tee e2e-output.$i.log
              rc=${PIPESTATUS[0]}
              if [ $rc -eq 0 ]; then
                echo "E2E passed on attempt $i"
                break
              fi
              if [ $i -lt $max ]; then
                echo "E2E failed (rc=$rc). Sleeping 10s before retry..."
                sleep 10
              else
                echo "E2E failed after $i attempts, leaving logs attached"
                exit $rc
              fi
              i=$((i+1))
            done
        env:
          CI: true
          ADB_INSTALL_TIMEOUT: '20'
          FIRESTORE_EMULATOR_HOST: 'localhost:8080'

      - name: Upload test artifacts (logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            e2e-output.*.log
            firestore-emulator.log

      - name: Stop Firestore emulator (graceful)
        if: always()
        run: |
          pkill -f firebase || true
          sleep 2
          tail -n 200 firestore-emulator.log || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: reports
