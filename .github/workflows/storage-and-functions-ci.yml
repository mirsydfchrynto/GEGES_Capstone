name: CI - Storage Rules & Functions Tests

on:
  push:
    branches: [ 'pr/reactive-payment-ci', 'main', 'master' ]
  pull_request:
    branches: [ 'main', 'master' ]

jobs:
  storage-rules-test:
    name: Storage rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '18'
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Run storage rules tests (inside emulators)
        run: |
          firebase emulators:exec "bash -lc 'cd scripts && npm ci && npm run test:storage'" --only firestore,storage
          # emulators:exec will set FIRESTORE_EMULATOR_HOST and FIREBASE_STORAGE_EMULATOR_HOST


  functions-tests:
    name: Functions unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '18'
      - name: Run functions tests
        working-directory: ./functions
        run: |
          npm ci
          npm test
